    nsfw_label: Reward
  - ff: tantalize
    edger: clutch_tantalize
    sfw_label: Tantalize
    nsfw_label: Tantalize
  - ff: wobble
    edger: clutch_pulse_wobble
    sfw_label: Wobble
    nsfw_label: Pulse Wobble
  - ff: accelerate
    edger: clutch_higher_rate
    sfw_label: Accelerate
    nsfw_label: Higher Rate
  - ff: clutch_breathe
    edger: clutch_tranquil
    sfw_label: Breathe
    nsfw_label: Tranquil
  - ff: praise         # steady reward pattern
    edger: clutch_good_slave
