# FunscriptForge SFW/NSFW label map for the Edger event catalog.
#
# Brands every Edger event (funscript_tools config.event_definitions.yml) with:
#   sfw_label  — neutral, motion-descriptive (the default shown in the tab;
#                Microsoft Store / SFW positioning).
#   nsfw_label — the raw Edger intent, surfaced by the Events tab's NSFW toggle.
#   featured   — true for the curated quick-access set (the Featured section
#                atop the library); the rest live only in their source groups.
#
# Keyed by `edger` (the event name = our effectId). `ff` is the historical
# prototype id where one existed, else the Edger name — informational only.
# Used by the Events catalog (list-event-recipes -> branded/featured labels) and
# by `cli.py edger-export` / `edger-import`. duration is always derived from the
# captured span (begin->end), never a param here.
#
# Reviewed + locked 2026-06-02: the sensitive raw names (ruin, denial, obey,
# submit, good_slave, slaps, edge_ce) get neutral motion SFW labels; the NSFW
# toggle still reveals the original term.
version: 1
mappings:
  # ── GENERAL ──────────────────────────────────────────────────────────
  - ff: edge
    edger: edge
    sfw_label: Edge
    nsfw_label: Edge
    featured: true
  - ff: surge
    edger: cum
    sfw_label: Surge
    nsfw_label: Cum
    featured: true
  - ff: fast
    edger: fast
    sfw_label: Fast
    nsfw_label: Fast
    featured: true
  - ff: steady
    edger: medium
    sfw_label: Steady
    nsfw_label: Medium
    featured: true
  - ff: slow
    edger: slow
    sfw_label: Slow
    nsfw_label: Slow
    featured: true
  - ff: hold
    edger: stay
    sfw_label: Hold
    nsfw_label: Stay
    featured: true
  - ff: cut
    edger: stop
    sfw_label: Cut
    nsfw_label: Stop
    featured: true
  - ff: breathe
    edger: tranquil
    sfw_label: Breathe
    nsfw_label: Tranquil
    featured: true
  - ff: glide          # ease/ramp transition
    edger: lube
    sfw_label: Glide
    nsfw_label: Lube
  - ff: rest
    edger: rest
    sfw_label: Rest
    nsfw_label: Rest
  - ff: drop           # volume drop (ruined-orgasm intent)
    edger: ruin
    sfw_label: Drop
    nsfw_label: Ruin

  # ── MCB ──────────────────────────────────────────────────────────────
  - ff: pulse
    edger: mcb_throb
    sfw_label: Pulse
    nsfw_label: Throb
    featured: true
  - ff: calm
    edger: mcb_calm
    sfw_label: Calm
    nsfw_label: Calm
  - ff: tease
    edger: mcb_tease
    sfw_label: Tease
    nsfw_label: Tease
  - ff: release
    edger: mcb_release
    sfw_label: Release
    nsfw_label: Release
  - ff: build
    edger: mcb_intensity_build
    sfw_label: Build
    nsfw_label: Intensity Build
  - ff: mcb_edge
    edger: mcb_edge
    sfw_label: Edge
    nsfw_label: Edge
  - ff: deep_edge
    edger: mcb_edge_ce
    sfw_label: Deep Edge
    nsfw_label: Edge CE
  - ff: withhold       # back off / deny
    edger: mcb_denial
    sfw_label: Withhold
    nsfw_label: Denial
  - ff: drive          # drive intensity up (command)
    edger: mcb_obey
    sfw_label: Drive
    nsfw_label: Obey
  - ff: yield          # settle down (command)
    edger: mcb_submit
    sfw_label: Yield
    nsfw_label: Submit

  # ── CLUTCH ───────────────────────────────────────────────────────────
  - ff: sweep
    edger: clutch_freq_shift_up
    sfw_label: Sweep Up
    nsfw_label: Freq Shift Up
    featured: true
  - ff: sweep_down
    edger: clutch_freq_shift_down
    sfw_label: Sweep Down
    nsfw_label: Freq Shift Down
  - ff: clutch_edge
    edger: clutch_edge
    sfw_label: Edge
    nsfw_label: Edge
  - ff: spike
    edger: clutch_spike
    sfw_label: Spike
    nsfw_label: Spike
  - ff: reward
    edger: clutch_reward
