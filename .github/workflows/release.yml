name: Release Builds

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows build
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build — Windows
    runs-on: windows-latest

    steps:
      - name: Checkout funscript-updater
        uses: actions/checkout@v4
        with:
          path: funscript-updater

      - name: Checkout funscript-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/funscript-tools
          path: funscript-tools

      - name: Checkout forge-ui-components (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forge-ui-components
          path: forge-ui-components

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: funscript-updater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ui/streamlit/requirements.txt
          pip install -r requirements-desktop.txt
          pip install -r requirements-dev.txt
          pip install -e ../forge-ui-components

      - name: Run tests
        working-directory: funscript-updater
        run: python cli.py test

      - name: Build with PyInstaller
        working-directory: funscript-updater
        run: pyinstaller FunscriptForge.spec --noconfirm --clean

      - name: Verify build
        working-directory: funscript-updater
        run: |
          if (!(Test-Path "dist\FunscriptForge\FunscriptForge.exe")) {
            Write-Error "Build artifact not found"
            exit 1
          }

      - name: Zip artifact
        working-directory: funscript-updater
        run: Compress-Archive -Path dist\FunscriptForge -DestinationPath dist\FunscriptForge-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunscriptForge-windows
          path: funscript-updater/dist/FunscriptForge-windows.zip

  # ---------------------------------------------------------------------------
  # macOS build
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build — macOS
    runs-on: macos-latest

    steps:
      - name: Checkout funscript-updater
        uses: actions/checkout@v4
        with:
          path: funscript-updater

      - name: Checkout funscript-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/funscript-tools
          path: funscript-tools

      - name: Checkout forge-ui-components (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forge-ui-components
          path: forge-ui-components

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: funscript-updater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ui/streamlit/requirements.txt
          pip install -r requirements-desktop.txt
          pip install -r requirements-dev.txt
          pip install -e ../forge-ui-components

      - name: Run tests
        working-directory: funscript-updater
        run: python cli.py test

      - name: Generate .icns icon
        working-directory: funscript-updater
        run: |
          ICO_SRC="media/funscriptforge_icon.png"
          ICNS_OUT="media/funscriptforge.icns"
          if [ -f "$ICO_SRC" ] && [ ! -f "$ICNS_OUT" ]; then
            ICONSET_DIR="$(mktemp -d)/FunscriptForge.iconset"
            mkdir -p "$ICONSET_DIR"
            for SIZE in 16 32 64 128 256 512; do
              sips -z "$SIZE" "$SIZE" "$ICO_SRC" --out "$ICONSET_DIR/icon_${SIZE}x${SIZE}.png" 2>/dev/null
              DOUBLE=$((SIZE * 2))
              sips -z "$DOUBLE" "$DOUBLE" "$ICO_SRC" --out "$ICONSET_DIR/icon_${SIZE}x${SIZE}@2x.png" 2>/dev/null
            done
            iconutil -c icns "$ICONSET_DIR" -o "$ICNS_OUT"
            rm -rf "$(dirname "$ICONSET_DIR")"
            echo "Generated $ICNS_OUT"
          fi

      - name: Build with PyInstaller
        working-directory: funscript-updater
        run: pyinstaller FunscriptForge.spec --noconfirm --clean

      - name: Verify build
        working-directory: funscript-updater
        run: |
          if [ ! -d "dist/FunscriptForge.app" ] && [ ! -d "dist/FunscriptForge" ]; then
            echo "Build artifact not found"
            exit 1
          fi

      - name: Zip artifact
        working-directory: funscript-updater
        run: |
          cd dist
          if [ -d "FunscriptForge.app" ]; then
            zip -r FunscriptForge-macos.zip FunscriptForge.app
          else
            zip -r FunscriptForge-macos.zip FunscriptForge
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunscriptForge-macos
          path: funscript-updater/dist/FunscriptForge-macos.zip

  # ---------------------------------------------------------------------------
  # Linux build
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build — Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout funscript-updater
        uses: actions/checkout@v4
        with:
          path: funscript-updater

      - name: Checkout funscript-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/funscript-tools
          path: funscript-tools

      - name: Checkout forge-ui-components (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forge-ui-components
          path: forge-ui-components

      - name: Install system dependencies (PyWebView GTK backend)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libgirepository1.0-dev \
            libcairo2-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: funscript-updater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ui/streamlit/requirements.txt
          pip install -r requirements-desktop.txt
          pip install -r requirements-dev.txt
          pip install -e ../forge-ui-components

      - name: Run tests
        working-directory: funscript-updater
        run: python cli.py test

      - name: Build with PyInstaller
        working-directory: funscript-updater
        run: pyinstaller FunscriptForge.spec --noconfirm --clean

      - name: Verify build
        working-directory: funscript-updater
        run: |
          if [ ! -f "dist/FunscriptForge/FunscriptForge" ]; then
            echo "Build artifact not found"
            exit 1
          fi

      - name: Create tarball
        working-directory: funscript-updater
        run: tar -czf dist/FunscriptForge-linux.tar.gz -C dist FunscriptForge

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunscriptForge-linux
          path: funscript-updater/dist/FunscriptForge-linux.tar.gz

  # ---------------------------------------------------------------------------
  # Create GitHub Release with all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: FunscriptForge-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: FunscriptForge-macos
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: FunscriptForge-linux
          path: artifacts/

      - name: Compute release name
        id: relname
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Strip leading "v" and turn "-alpha"/"-beta"/"-rc" into a spaced suffix
          STRIPPED="${TAG#v}"
          NAME="FunscriptForge ${STRIPPED//-/ }"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Release name: $NAME"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: liquid-releasing/funscriptforge-releases
          token: ${{ secrets.RELEASES_PAT }}
          name: ${{ steps.relname.outputs.name }}
          prerelease: false
          files: |
            artifacts/FunscriptForge-windows.zip
            artifacts/FunscriptForge-macos.zip
            artifacts/FunscriptForge-linux.tar.gz
          body: |
            > ⚠️ **Alpha release.** This build is under active development. Expect rough edges, incomplete features, and occasional breakage. Feedback is welcome.

            ## Downloads
            - **Windows** — `FunscriptForge-windows.zip` — unzip and run `FunscriptForge.exe`
            - **macOS** — `FunscriptForge-macos.zip` — unzip and open `FunscriptForge.app`
            - **Linux** — `FunscriptForge-linux.tar.gz` — extract and run `FunscriptForge/FunscriptForge`

            See [the documentation](https://liquid-releasing.github.io/funscriptforge/) and [funscriptforge.com](https://funscriptforge.com) for usage.
          append_body: true
          generate_release_notes: true
