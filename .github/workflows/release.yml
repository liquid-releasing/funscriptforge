name: Release (Tauri)

# Builds the Tauri desktop app + its PyInstaller-frozen Python backend
# (forge-cli) and publishes installers to liquid-releasing/funscriptforge-releases.
#
# Shape (see internal/design + the release memory): the Rust shell calls a
# bundled `forge-cli` resource (frozen cli.py + librosa/numba/scipy/videoflow +
# funscript-tools), with a bundled ffmpeg on PATH. tauri.release.conf.json adds
# the `bundle.resources` overlay so only the packaged build ships them.
#
# Windows-first: the dogfood + primary beta platform. macOS/Linux are a
# follow-up (mainly per-platform static-ffmpeg sourcing + the unsigned-app note).

on:
  push:
    tags:
      - "v*"
  # Build-only dry run. Lets a new platform be exercised end to end without
  # spending a version tag on it — the publish job is tag-gated below.
  # `platforms` keeps a single-platform retry from rebuilding the other two;
  # the Windows job alone is ~50 minutes of runner time.
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which builds to run"
        type: choice
        default: all
        options: [all, windows, macos, linux]

permissions:
  contents: write

env:
  # Match the locally-proven freeze (the dev .venv that produced a working
  # bundle is 3.13 — the forge-cli payload is cp313).
  PYTHON_VERSION: "3.13"

jobs:
  build-windows:
    name: Build — Windows
    runs-on: windows-latest
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.platforms == 'all'
      || inputs.platforms == 'windows'
    # The prior cut died after ~53 min when the Tauri build starved the runner
    # for memory (solid-LZMA NSIS compression of the ~580 MB resource payload).
    # Fail fast on a hang rather than burning an hour.
    timeout-minutes: 90

    steps:
      - name: Checkout funscriptforge
        uses: actions/checkout@v4
        with:
          path: funscript-updater

      - name: Checkout funscript-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/funscript-tools
          path: funscript-tools

      - name: Checkout forge-ui-components (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forge-ui-components
          path: forge-ui-components

      - name: Checkout videoflow (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/videoflow
          path: videoflow

      - name: Checkout forgemoment (sibling)
        # The frontend imports the shared `forgemoment` library by bare
        # specifier; package.json links it as `file:../../../forgemoment`
        # and vite.config aliases it to that same source tree. vite compiles
        # forgemoment/src/* directly (no separate build), so it just has to
        # exist as a sibling of this checkout before `npm ci` + tauri build.
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forgemoment
          path: forgemoment

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps + freeze forge-cli
        working-directory: funscript-updater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../videoflow
          pip install -e ../forge-ui-components
          pip install onnxruntime pyinstaller
          pyinstaller forge-cli.spec --noconfirm --clean

      - name: Verify forge-cli runs
        working-directory: funscript-updater
        run: |
          if (!(Test-Path "dist\forge-cli\forge-cli.exe")) { Write-Error "forge-cli not built"; exit 1 }
          & "dist\forge-cli\forge-cli.exe" list-characters --format json > $null
          if ($LASTEXITCODE -ne 0) { Write-Error "forge-cli list-characters failed"; exit 1 }
          # Exercises a YAML path (reads the vendored Edger event catalog).
          # PyYAML was undeclared in requirements.txt, so CI froze a build with
          # no yaml module and shipped it: Export, Import, Events and Polish all
          # died with ModuleNotFoundError while dev worked, because the dev venv
          # had PyYAML transitively. list-characters alone never touched yaml.
          & "dist\forge-cli\forge-cli.exe" list-event-recipes > $null
          if ($LASTEXITCODE -ne 0) { Write-Error "forge-cli list-event-recipes failed"; exit 1 }

      - name: Fetch static ffmpeg
        working-directory: funscript-updater
        run: |
          # gyan.dev "essentials" — smaller than BtbN gpl-full but still ships
          # libx264 (needed for the 720p chapter-clip downscale). Smaller payload
          # = less for the Windows bundlers to compress (the OOM lever).
          $url = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract -Force
          $bin = Get-ChildItem -Path ffmpeg_extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 | Split-Path
          New-Item -ItemType Directory -Force -Path ui\web\src-tauri\resources\ffmpeg | Out-Null
          Copy-Item "$bin\ffmpeg.exe","$bin\ffprobe.exe" ui\web\src-tauri\resources\ffmpeg\
          # GPL compliance: this is a --enable-gpl build (libx264). Ship the
          # build's own LICENSE + README (states the exact GPL version, build
          # config, and corresponding-source URL) next to the binary so the
          # installed app carries the license of the binary it redistributes.
          $root = Split-Path $bin
          Copy-Item "$root\LICENSE.txt" ui\web\src-tauri\resources\ffmpeg\LICENSE.txt -ErrorAction SilentlyContinue
          Copy-Item "$root\README.txt" ui\web\src-tauri\resources\ffmpeg\README.txt -ErrorAction SilentlyContinue
          # Free the download + extraction (~370 MB) before the build.
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_extract

      - name: Stage forge-cli into Tauri resources
        working-directory: funscript-updater
        run: |
          New-Item -ItemType Directory -Force -Path ui\web\src-tauri\resources | Out-Null
          # Move (not copy) so only one ~360 MB copy of the freeze exists on disk.
          # The "Verify forge-cli runs" step already ran against dist\forge-cli.
          Move-Item -Force dist\forge-cli ui\web\src-tauri\resources\forge-cli

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: funscript-updater/ui/web/src-tauri

      - name: Install npm deps
        working-directory: funscript-updater/ui/web
        run: npm ci

      - name: Install forgemoment deps
        # vite compiles forgemoment/src/* directly, so its runtime deps
        # (lucide-react; react/react-dom are peers supplied here) must resolve
        # from forgemoment/node_modules — exactly as in the local dev loop.
        working-directory: forgemoment
        run: npm ci

      - name: Stamp dev version (dispatch builds only)
        # A build-only dispatch used to produce binaries whose version string
        # was byte-identical to the last release, so a tester could not tell
        # which one they had installed -- and on 2026-09-05 could not, costing
        # a round of "the feature is missing" on a build that never had it.
        # This stamps package.json (the file appVersion.js reads) so the title
        # bar and About dialog say e.g. "0.3.17-alpha+dev.446dd7c".
        # tauri.conf.json is deliberately untouched: the MSI bundler rejects a
        # non-numeric pre-release identifier.
        if: github.event_name == 'workflow_dispatch'
        working-directory: funscript-updater
        shell: bash
        run: python scripts/bump_version.py --dev-stamp "${GITHUB_SHA:0:7}"

      - name: Tauri build (with bundled-resources overlay)
        working-directory: funscript-updater/ui/web
        # Cap codegen parallelism so concurrent rustc processes don't peak the
        # runner's RAM during the compile phase.
        env:
          CARGO_BUILD_JOBS: 2
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Rename to stable filenames
        working-directory: funscript-updater
        shell: bash
        run: |
          mkdir -p dist-stable
          # A dispatch build is a TEST build: mark the filename so a downloaded
          # installer is self-describing before it is even run. Tag builds keep
          # the stable names that the publish job and the website's
          # releases/latest/download/ links depend on.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARK="-TEST-${GITHUB_SHA:0:7}"
          else
            MARK=""
          fi
          BUNDLE="ui/web/src-tauri/target/release/bundle"
          cp "$BUNDLE"/msi/*.msi   "dist-stable/FunscriptForge${MARK}-Setup-windows.msi"
          cp "$BUNDLE"/nsis/*.exe  "dist-stable/FunscriptForge${MARK}-Setup-windows.exe"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: funscriptforge-windows
          if-no-files-found: error
          path: funscript-updater/dist-stable/*

  build-macos:
    name: Build — macOS (Apple Silicon)
    runs-on: macos-14
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.platforms == 'all'
      || inputs.platforms == 'macos'
    timeout-minutes: 90
    # First cut on this path. A brand-new build must not be able to sink a
    # release whose Windows half is proven — the publish job ships whatever
    # actually built.
    continue-on-error: true

    steps:
      - name: Checkout funscriptforge
        uses: actions/checkout@v4
        with:
          path: funscript-updater

      - name: Checkout funscript-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/funscript-tools
          path: funscript-tools

      - name: Checkout forge-ui-components (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forge-ui-components
          path: forge-ui-components

      - name: Checkout videoflow (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/videoflow
          path: videoflow

      - name: Checkout forgemoment (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forgemoment
          path: forgemoment

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps + freeze forge-cli
        working-directory: funscript-updater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../videoflow
          pip install -e ../forge-ui-components
          pip install onnxruntime pyinstaller
          pyinstaller forge-cli.spec --noconfirm --clean

      - name: Verify forge-cli runs
        working-directory: funscript-updater
        run: |
          test -x dist/forge-cli/forge-cli || { echo "forge-cli not built"; exit 1; }
          ./dist/forge-cli/forge-cli list-characters --format json > /dev/null
          # Exercises a YAML path (reads the vendored Edger event catalog);
          # see the Windows job for why list-characters alone was not enough.
          ./dist/forge-cli/forge-cli list-event-recipes > /dev/null

      - name: Fetch static ffmpeg (arm64)
        working-directory: funscript-updater
        run: |
          # osxexperts publishes arm64-native STATIC builds of ffmpeg and
          # ffprobe as separate zips. Static matters here: a Homebrew ffmpeg
          # links dylibs that will not exist on the user machine.
          mkdir -p ui/web/src-tauri/resources/ffmpeg
          curl -fsSL -o ffmpeg.zip  https://www.osxexperts.net/ffmpeg711arm.zip
          curl -fsSL -o ffprobe.zip https://www.osxexperts.net/ffprobe711arm.zip
          unzip -o -j ffmpeg.zip  -d ui/web/src-tauri/resources/ffmpeg
          unzip -o -j ffprobe.zip -d ui/web/src-tauri/resources/ffmpeg
          chmod +x ui/web/src-tauri/resources/ffmpeg/ffmpeg
          chmod +x ui/web/src-tauri/resources/ffmpeg/ffprobe
          ui/web/src-tauri/resources/ffmpeg/ffmpeg  -hide_banner -version | head -1
          ui/web/src-tauri/resources/ffmpeg/ffprobe -hide_banner -version | head -1
          rm -f ffmpeg.zip ffprobe.zip

      - name: Stage forge-cli into Tauri resources
        working-directory: funscript-updater
        run: |
          mkdir -p ui/web/src-tauri/resources
          mv dist/forge-cli ui/web/src-tauri/resources/forge-cli

      - name: Generate macOS .icns
        working-directory: funscript-updater/ui/web/src-tauri
        run: |
          # The repo carries icon.png + icon.ico only; the macOS bundler wants
          # an .icns. Build it with the platform tools rather than committing a
          # binary that would drift from the source PNG.
          set -e
          ICONSET=icons/icon.iconset
          rm -rf "$ICONSET"
          mkdir -p "$ICONSET"
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz icons/icon.png --out "$ICONSET/icon_${sz}x${sz}.png" > /dev/null
            sips -z $((sz*2)) $((sz*2)) icons/icon.png --out "$ICONSET/icon_${sz}x${sz}@2x.png" > /dev/null
          done
          iconutil -c icns "$ICONSET" -o icons/icon.icns
          rm -rf "$ICONSET"
          ls -la icons/icon.icns

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: funscript-updater/ui/web/src-tauri

      - name: Install npm deps
        working-directory: funscript-updater/ui/web
        run: npm ci

      - name: Install forgemoment deps
        working-directory: forgemoment
        run: npm ci

      - name: Stamp dev version (dispatch builds only)
        # A build-only dispatch used to produce binaries whose version string
        # was byte-identical to the last release, so a tester could not tell
        # which one they had installed -- and on 2026-09-05 could not, costing
        # a round of "the feature is missing" on a build that never had it.
        # This stamps package.json (the file appVersion.js reads) so the title
        # bar and About dialog say e.g. "0.3.17-alpha+dev.446dd7c".
        # tauri.conf.json is deliberately untouched: the MSI bundler rejects a
        # non-numeric pre-release identifier.
        if: github.event_name == 'workflow_dispatch'
        working-directory: funscript-updater
        shell: bash
        run: python scripts/bump_version.py --dev-stamp "${GITHUB_SHA:0:7}"

      - name: Tauri build (with bundled-resources overlay)
        working-directory: funscript-updater/ui/web
        env:
          CARGO_BUILD_JOBS: 2
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles dmg

      - name: Rename to stable filenames
        working-directory: funscript-updater
        run: |
          mkdir -p dist-stable
          # A dispatch build is a TEST build: mark the filename so a downloaded
          # installer is self-describing before it is even run. Tag builds keep
          # the stable names that the publish job and the website's
          # releases/latest/download/ links depend on.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARK="-TEST-${GITHUB_SHA:0:7}"
          else
            MARK=""
          fi
          cp ui/web/src-tauri/target/release/bundle/dmg/*.dmg "dist-stable/FunscriptForge${MARK}-macos-arm64.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: funscriptforge-macos
          if-no-files-found: error
          path: funscript-updater/dist-stable/*

  build-linux:
    name: Build — Linux (x86-64)
    if: >-
      github.event_name != 'workflow_dispatch'
      || inputs.platforms == 'all'
      || inputs.platforms == 'linux'
    # 22.04 rather than latest: an AppImage inherits the builder glibc, so
    # building on the oldest supported runner is what makes it portable.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    continue-on-error: true

    steps:
      - name: Checkout funscriptforge
        uses: actions/checkout@v4
        with:
          path: funscript-updater

      - name: Checkout funscript-tools (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/funscript-tools
          path: funscript-tools

      - name: Checkout forge-ui-components (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forge-ui-components
          path: forge-ui-components

      - name: Checkout videoflow (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/videoflow
          path: videoflow

      - name: Checkout forgemoment (sibling)
        uses: actions/checkout@v4
        with:
          repository: liquid-releasing/forgemoment
          path: forgemoment

      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf file build-essential curl wget libxdo-dev libssl-dev \
            libfuse2 libtbb12

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python deps + freeze forge-cli
        working-directory: funscript-updater
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ../videoflow
          pip install -e ../forge-ui-components
          pip install onnxruntime pyinstaller
          pyinstaller forge-cli.spec --noconfirm --clean

      - name: Verify forge-cli runs
        working-directory: funscript-updater
        run: |
          test -x dist/forge-cli/forge-cli || { echo "forge-cli not built"; exit 1; }
          ./dist/forge-cli/forge-cli list-characters --format json > /dev/null
          # Exercises a YAML path (reads the vendored Edger event catalog);
          # see the Windows job for why list-characters alone was not enough.
          ./dist/forge-cli/forge-cli list-event-recipes > /dev/null

      - name: Fetch static ffmpeg
        working-directory: funscript-updater
        run: |
          # johnvansickle static amd64: GPL (libx264 present, which the 720p
          # chapter-clip downscale needs) and self-contained.
          mkdir -p ui/web/src-tauri/resources/ffmpeg
          curl -fsSL -o ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          mkdir -p ffmpeg_extract
          tar -xJf ffmpeg.tar.xz -C ffmpeg_extract --strip-components=1
          cp ffmpeg_extract/ffmpeg ffmpeg_extract/ffprobe ui/web/src-tauri/resources/ffmpeg/
          chmod +x ui/web/src-tauri/resources/ffmpeg/ffmpeg
          chmod +x ui/web/src-tauri/resources/ffmpeg/ffprobe
          # GPL compliance: ship the build licence texts beside the binary.
          cp ffmpeg_extract/GPLv3.txt  ui/web/src-tauri/resources/ffmpeg/ || true
          cp ffmpeg_extract/readme.txt ui/web/src-tauri/resources/ffmpeg/ || true
          ui/web/src-tauri/resources/ffmpeg/ffmpeg -hide_banner -version | head -1
          rm -rf ffmpeg.tar.xz ffmpeg_extract

      - name: Stage forge-cli into Tauri resources
        working-directory: funscript-updater
        run: |
          mkdir -p ui/web/src-tauri/resources
          mv dist/forge-cli ui/web/src-tauri/resources/forge-cli

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: funscript-updater/ui/web/src-tauri

      - name: Install npm deps
        working-directory: funscript-updater/ui/web
        run: npm ci

      - name: Install forgemoment deps
        working-directory: forgemoment
        run: npm ci

      # Two separate bundle passes, because they have very different odds.
      # The .deb is produced by Tauri itself and has built cleanly every run.
      # The AppImage shells out to linuxdeploy, which has failed every run so
      # far with a message Tauri swallows the detail of. Bundling them in one
      # command meant the AppImage took the .deb down with it: the step
      # exited 1, so the rename and upload never ran and Linux shipped
      # nothing despite having a working package sitting on disk.
      - name: Stamp dev version (dispatch builds only)
        # A build-only dispatch used to produce binaries whose version string
        # was byte-identical to the last release, so a tester could not tell
        # which one they had installed -- and on 2026-09-05 could not, costing
        # a round of "the feature is missing" on a build that never had it.
        # This stamps package.json (the file appVersion.js reads) so the title
        # bar and About dialog say e.g. "0.3.17-alpha+dev.446dd7c".
        # tauri.conf.json is deliberately untouched: the MSI bundler rejects a
        # non-numeric pre-release identifier.
        if: github.event_name == 'workflow_dispatch'
        working-directory: funscript-updater
        shell: bash
        run: python scripts/bump_version.py --dev-stamp "${GITHUB_SHA:0:7}"

      - name: Tauri build — deb
        working-directory: funscript-updater/ui/web
        env:
          CARGO_BUILD_JOBS: 2
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles deb

      - name: Tauri build — AppImage
        working-directory: funscript-updater/ui/web
        # Known-flaky, and deliberately not allowed to fail the job.
        continue-on-error: true
        env:
          CARGO_BUILD_JOBS: 2
          # linuxdeploy and its appimage plugin are themselves AppImages, and
          # an AppImage mounts itself through FUSE to run. Hosted runners have
          # no FUSE device, so the first cut died with "failed to run
          # linuxdeploy". This makes the runtime extract and exec instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # linuxdeploy strips binaries by default and chokes on some; the
          # payload here is a 360 MB PyInstaller freeze it has no business
          # touching.
          NO_STRIP: "true"
          # linuxdeploy's own failure message is what we actually need; it
          # logs to stderr and Tauri only forwards that under --verbose.
          VERBOSE: "1"
        run: |
          df -h / | tail -1
          npx tauri build --verbose --config src-tauri/tauri.release.conf.json --bundles appimage

      - name: Rename to stable filenames
        working-directory: funscript-updater
        run: |
          mkdir -p dist-stable
          # A dispatch build is a TEST build: mark the filename so a downloaded
          # installer is self-describing before it is even run. Tag builds keep
          # the stable names that the publish job and the website's
          # releases/latest/download/ links depend on.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MARK="-TEST-${GITHUB_SHA:0:7}"
          else
            MARK=""
          fi
          BUNDLE=ui/web/src-tauri/target/release/bundle
          cp "$BUNDLE"/deb/*.deb "dist-stable/FunscriptForge${MARK}-linux-amd64.deb"
          cp "$BUNDLE"/appimage/*.AppImage "dist-stable/FunscriptForge${MARK}-linux-x86_64.AppImage" || \
            echo "::warning::AppImage not produced — shipping the .deb only"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: funscriptforge-linux
          if-no-files-found: error
          path: funscript-updater/dist-stable/*

  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    # `always()` so a failing macOS or Linux build still publishes the
    # platforms that succeeded, rather than holding the whole release
    # hostage to the newest build path. Windows is still required: if it
    # failed there is nothing worth publishing.
    if: always() && needs.build-windows.result == 'success' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Report what actually built
        run: |
          echo "windows: ${{ needs.build-windows.result }}"
          echo "macos:   ${{ needs.build-macos.result }}"
          echo "linux:   ${{ needs.build-linux.result }}"
          find artifacts -type f -exec ls -lh {} +

      - name: Compute release name
        id: relname
        run: |
          TAG="${GITHUB_REF_NAME}"
          STRIPPED="${TAG#v}"
          echo "name=FunscriptForge ${STRIPPED//-/ }" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: liquid-releasing/funscriptforge-releases
          token: ${{ secrets.RELEASES_PAT }}
          name: ${{ steps.relname.outputs.name }}
          tag_name: ${{ github.ref_name }}
          # Published as a PRERELEASE, deliberately. GitHub excludes
          # prereleases from releases/latest, and funscriptforge-web's download
          # buttons point at releases/latest/download/ -- so a normal release
          # would put new binaries in front of every visitor the moment CI
          # finishes, under whatever version the site's note still claims.
          # That mismatch shipped once already (the site advertised v0.2.15
          # while serving v0.2.16 binaries).
          #
          # Promoting is one deliberate step once a build has been dogfooded:
          #   gh release edit <tag> --repo liquid-releasing/funscriptforge-releases --prerelease=false --latest
          # and then bump the site with scripts/bump_version.py.
          prerelease: true
          generate_release_notes: true
          append_body: true
          fail_on_unmatched_files: false
          files: |
            artifacts/funscriptforge-windows/FunscriptForge-Setup-windows.msi
            artifacts/funscriptforge-windows/FunscriptForge-Setup-windows.exe
            artifacts/funscriptforge-macos/FunscriptForge-macos-arm64.dmg
            artifacts/funscriptforge-linux/FunscriptForge-linux-x86_64.AppImage
            artifacts/funscriptforge-linux/FunscriptForge-linux-amd64.deb
          body: |
            > ⚠️ **Alpha — under active development.** Expect rough edges.

            FunscriptForge — analyze, author, and shape funscripts + haptics for
            e-stim, strokers, and multi-axis devices. Local desktop app.

            ## Downloads

            Every build bundles its own Python backend and ffmpeg — nothing
            else to install. All builds are **unsigned**, so each OS asks once:

            | Platform | File | First run |
            | --- | --- | --- |
            | Windows | `FunscriptForge-Setup-windows.msi` (recommended) or `-windows.exe` (NSIS) | SmartScreen → More info → Run anyway |
            | macOS (Apple Silicon) | `FunscriptForge-macos-arm64.dmg` | Right-click the app → Open, or `xattr -dr com.apple.quarantine /Applications/FunscriptForge.app` |
            | Linux (x86-64) | `FunscriptForge-linux-x86_64.AppImage` (portable) or `-linux-amd64.deb` | `chmod +x` the AppImage before running |

            macOS builds are Apple Silicon only for now — Intel Macs are not
            covered by this release.

      - name: Notify funscriptforge-web (best-effort)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh api --method POST -H "Accept: application/vnd.github+json" \
            /repos/liquid-releasing/funscriptforge-web/dispatches \
            -f event_type='release-published' \
            -f 'client_payload[tag]'="$TAG_NAME" \
            || echo "::warning::funscriptforge-web dispatch failed (repo may not listen yet)"
